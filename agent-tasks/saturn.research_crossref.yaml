# Saturn task. PHI: refs-only params (a namespace id and topic words; no names, no record text), claude tier only,
# output as a PR on jobs/<id> in the records repo (the env sets the repo; see README.md).
# Method: docs/methods/research-crossref.md. Output contract: saturn.research_crossref.output.schema.json.
# Phase 1: enabled, but the dispatcher does not implement git_pr delivery yet, so a submitted job fails as a
# contract error (dead). Do not submit until phase 2.
name: saturn.research_crossref
description: Cross-reference one person's recorded data against the literature and labels (record and flag only).
enabled: true
tiers: [deep]                 # claude harness, opus (agent-server src/policy.ts)
model: opus
max_class: phi
min_class: phi                # runs against records: a client that labels it lower is rejected
subscription: owner_use
tools: [Read, Grep, Glob, Write, Edit, WebSearch, WebFetch, "Bash(python3 -I */tools/research/verify_citations.py *)"]
outputs: [git_pr]
max_attempts: 2
budget: { max_usd: 15, max_turns: 150, timeout_s: 3600 }
params_schema:
  type: object
  additionalProperties: false
  required: [ns]
  properties:
    ns: { type: string, pattern: "^[a-z][a-z0-9-]*$", maxLength: 40 }
    focus:
      type: array
      maxItems: 5
      items: { type: string, maxLength: 80, pattern: "^[A-Za-z0-9 ,()/+-]+$" }
    previous: { type: string, maxLength: 200, pattern: "^docs/health/[a-z0-9-]+/research/(private/)?[0-9]{4}-[0-9]{2}-[0-9]{2}-crossref\\.md$" }
    visibility: { enum: [public, private], default: public }   # method 4a; private writes under research/private/
    reason: { enum: [scheduled, new-labs, new-medicine, new-condition, new-guideline, on-request] }
output_schema:
  type: object
  required: [summary, crossref_md, crossref_json, question_ids, red_flags, verifier]
  additionalProperties: false
  properties:
    summary: { type: string, maxLength: 600 }
    crossref_md: { type: string, pattern: "^docs/health/[a-z0-9-]+/research/(private/)?[0-9]{4}-[0-9]{2}-[0-9]{2}-crossref\\.md$" }
    crossref_json: { type: string, pattern: "^docs/health/[a-z0-9-]+/research/(private/)?[0-9]{4}-[0-9]{2}-[0-9]{2}-crossref\\.json$" }
    question_ids: { type: array, items: { type: string, pattern: "^[a-z][a-z0-9-]*:q:[0-9]{4}$" } }
    red_flags: { type: integer, minimum: 0 }
    verifier: { type: object, required: [errors, warnings], properties: { errors: { const: 0 }, warnings: { type: integer } } }
prompt: |
  You are running the Saturn research cross-reference for namespace {{ns}} in a records repo checkout.
  Follow docs/methods/research-crossref.md in the Saturn product checkout exactly (the product is pinned by the
  environment; its path is in SATURN_PRODUCT_DIR). Focus areas (may be empty = all): {{focus}}.
  Previous cross-reference to revisit (may be empty): {{previous}}. Reason: {{reason}}.
  Visibility (empty = public): {{visibility}}.

  Non-negotiable:
  1. Record and flag only. Never diagnose. Never suggest starting, stopping or changing a medicine or dose.
     Associations, never causation. Every concern becomes a question for the named clinician.
  2. Red flags first (method step 2). If a recorded finding matches a red-flag rule, write it at the top as
     "seek urgent care now" and do not research it.
  3. No PHI leaves the repo. Web queries use generic clinical terms only: no names, ids, dates, places, facility
     or doctor names, and no record text pasted verbatim.
  4. Every item cites a resolvable PMID, DOI or URL with a verbatim quote of at most 400 characters. Never cite
     from memory: fetch it, then quote it. LINK-ONLY bodies (AUA, EAU, NICE, ESC, ADA,
     ICMR, Endocrine Society; method, "Source priority"): never fetch, quote or summarise their recommendations;
     cite the body, version, recommendation number (locator) and URL, with no quote, and point the clinician to it
     by name. Such an item (no secondary source) is kind: pointer with that one citation (body, title, version,
     locator) and a read_checklist entry for its URL, and its statement is exactly this template, nothing else:
     "<body>, <title> (<version>), <locator>: see read checklist."
     Then search for a legitimately quotable open-access SECONDARY source that reports the recommendation
     (method step 5a; tiers and licences in section 4). Quote only that, set source_tier, license and
     reports_guideline, and open the statement "secondary: reports <guideline> recommendation". Never present
     it as the guideline's own text. Every quoted citation needs source_tier and a licence read from the source.
     For each relevant link-only guideline also write a read_checklist entry (method 5b): body, title, version, URL,
     locator, the KB ids to compare, recheck_after from the cadence table, and a blank own_words_note. No guideline
     text and no summary of what it recommends.
  4a. Visibility private only (method 4a): sources listed in the records repo's config/research-private-sources.yaml
     (copyright-only, no AI/TDM/upload ban) may be read, summarised and quoted briefly with attribution, under
     source_tier restricted and license private-research. Read restricted PDFs from
     docs/health/{{ns}}/research/private/.cache/ (gitignored); never commit a PDF or long text. AUA, EAU, NICE, ESC,
     ADA and Endocrine Society stay link-only in this mode too. Write the outputs under docs/health/{{ns}}/research/private/ and set
     "visibility": "private" in the sidecar. Nothing from a private output goes into a public page, brief or query.
  5. Write docs/health/{{ns}}/research/<today>-crossref.md (private: research/private/<today>-crossref.md) (the template in the method) and its JSON sidecar
     (saturn.research_crossref.output.schema.json); add new questions to docs/health/{{ns}}/questions.md with
     the next free {{ns}}:q:NNNN ids. Edit nothing else; never touch data/ or generated blocks.
  6. Run python3 -I "$SATURN_PRODUCT_DIR/tools/research/verify_citations.py" <sidecar> --check-quotes (private:
     add --sources config/research-private-sources.yaml) and fix
     every error (drop the item if its citation cannot be verified). Record the verifier result in the sidecar.
  Return the output_schema JSON only.
