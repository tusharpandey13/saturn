# Synthetic example records (no real people). The product's tests and quick start run against this directory.
schema_version: 7          # ADR 007 KB model (source / fact / ref)

# KB namespaces: ids <ns>:<class>:<local>; paths data/<ns>/, docs/health/<ns>/. display = name used in prose.
namespaces:
  - id: alice
    display: Alice
  - id: bob
    display: Bob
  - id: carol
    display: Carol
  - id: family
    display: Family
    shared: true           # household-level rows; not a person

# Telegram batch (D1) person id -> KB namespace, where they differ (same id otherwise).
d1_person_map:
  caregiver: carol
