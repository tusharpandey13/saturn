# Synthetic example records (no real people). The product's tests and quick start run against this directory.
schema_version: 7          # ADR 007 KB model (source / fact / ref)

# KB namespaces: ids <ns>:<class>:<local>; paths data/<ns>/, docs/health/<ns>/. display = name used in prose.
namespaces:
  - id: alice
    display: Alice
  - id: bob
    display: Bob
  - id: carol
    display: Carol
  - id: family
    display: Family
    shared: true           # household-level rows; not a person

# Telegram batch (D1) person id -> KB namespace, where they differ (same id otherwise). Every D1 person is a member
# (role member or admin); each member's messages are extracted into their own namespace.
d1_person_map:
  carol-tg: carol

# Name prefixes per namespace (ADR 009): a message that starts with one ("ali 116/47", "Ali ka BP ...") is recorded
# for that namespace, whoever sent it; the echo and the digest name who it was logged for. Matched case-insensitively.
aliases:
  alice: [alice, ali, एलिस]
  bob: [bob]
  carol: [carol]

# Life-context signals (ADR 010): each member's own confirmation, recorded by the admin. Only true allows extraction;
# false (opted out) or pending = nothing is read for that member and nothing is recorded about them.
context_consent:
  alice: true
  bob: pending
  carol: true
