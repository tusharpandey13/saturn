# Saturn -> environment contract (ADR 008: product / environment / PII split).
# An env repo supplies env.yaml with the vars below, secrets under these NAMES (never values here) and product.lock
# pinning this repo. It also checks out a records repo (records.yaml, schema_version below).
# Check an env file: `cd app && npm run env:check -- --env <env.yaml>`.
manifest: 1
env_schema: 1                          # env.yaml `schema:` this product version reads
records_schema_versions: [7]           # records.yaml schema_version this product version reads

resources:
  - kind: cloudflare-worker            # ingest webhook (app/src/worker.ts)
    config: deploy/wrangler.template.toml   # rendered to app/wrangler.toml by app/scripts/render.ts
  - kind: cloudflare-d1                # inbox; auto-provisioned by `wrangler deploy` when cloudflare.d1.id is empty
    binding: DB
    migrations: app/migrations/
  - kind: cloudflare-r2                # media bucket; auto-provisioned the same way
    binding: MEDIA
  - kind: telegram-bot                 # one bot, one or more allowed group chats (allowlist in D1)
  - kind: records-repo                 # git repo with records.yaml; the batch commits to it
                                       # optional config/thresholds.yaml: red-flag thresholds (absent = rules off)
  - kind: ci-runner                    # GitHub Actions in the env repo (deploy/github/*.yml templates)

# Keys in env.yaml (dotted paths). Types: str, int, bool, map; a trailing ? = optional.
vars:
  cloudflare.account_id: str?          # identifier, not a credential; required by deploy and the batch D1 API
  cloudflare.worker_name: str
  cloudflare.compatibility_date: str
  cloudflare.d1.name: str
  cloudflare.d1.id: str?               # empty until the first deploy provisions it; then pin it here
  cloudflare.r2_bucket: str
  worker_url: str?                     # https://<worker>.<subdomain>.workers.dev; webhook assertion + smoke test
  go_live: bool                        # false until the owner opens the go-live gate (no real data before)
  records.repo: str                    # <owner>/<records-repo>
  records.branch: str
  batch.cron: str                      # UTC cron for the daily batch
  batch.claude_code_version: str?      # exact CLI pin when the claude-cli adapter is used
  batch.inbox_retention_days: int
  batch.llm_adapter: str               # claude-cli | fake
  batch.stt_adapter: str               # whisper-cpp (local, on the runner) | sarvam | none; batch env STT_ADAPTER
  batch.stt_max_audio_min: int?        # whisper-cpp: audio minutes per run (default 30; the rest wait as stt_pending); STT_MAX_AUDIO_MIN
  batch.stt_max_runtime_min: int?      # whisper-cpp: wall minutes of STT per run (default 20); STT_MAX_RUNTIME_MIN
  batch.extract_model_transcript: str? # voice-note transcripts (default claude-sonnet-5-5); EXTRACT_MODEL_TRANSCRIPT
  batch.extract_model_text: str?       # text messages (default claude-haiku-5-5); batch env EXTRACT_MODEL_TEXT
  batch.extract_model_media: str?      # photos and PDFs (default claude-sonnet-5-5; claude-opus-5-5 for the hardest); EXTRACT_MODEL_MEDIA
  batch.extract_max_media_calls: int?  # usage guard: photo/PDF model calls per run (default 30; the rest wait); EXTRACT_MAX_MEDIA_CALLS
  context_mode: str?                   # life-context signals (ADR 010): off (default) | shadow | on; batch env CONTEXT_MODE
  ack_mode: str?                       # Worker acks, admin private chat only (groups never, ADR 011): off (default) | vitals-only | all; Worker var ACK_MODE

# Secret names, consumer, scope and maximum lifetime. Values live only in the env repo's SOPS files. The
# deploy/github templates decrypt them per step at runtime (deploy/github/ci run), so the only standing CI secret is
# SOPS_AGE_KEY (a CI-only age recipient). Identifiers (account id, D1 id) are env.yaml values, not secrets.
secrets:
  - name: CLOUDFLARE_DEPLOY_TOKEN
    consumer: deploy (wrangler deploy, migrations, secret push)
    scope: Workers Scripts edit + D1 edit + R2 edit on one account
    max_ttl: 90d
  - name: CLOUDFLARE_D1_TOKEN
    consumer: batch pull/finish
    scope: D1 edit on one account
    max_ttl: 90d
  - name: CLOUDFLARE_R2_TOKEN
    consumer: batch pull (optional; else the D1 token needs R2 read)
    scope: R2 object read, one bucket
    max_ttl: 90d
  - name: TELEGRAM_BOT_TOKEN
    consumer: Worker (admin-DM acks, /for feedback), batch (media, admin digest + ops DMs)
    scope: one bot
    max_ttl: 365d
  - name: TELEGRAM_WEBHOOK_SECRET
    consumer: Worker (webhook header check)
    scope: one webhook
    max_ttl: 365d
  - name: CLAUDE_CODE_OAUTH_TOKEN
    consumer: batch extract (claude-cli adapter); or ANTHROPIC_API_KEY, an env choice
    scope: the provider account the env chose
    max_ttl: 365d
  - name: SARVAM_API_KEY
    consumer: batch extract (sarvam adapter; optional, voice waits as stt_pending without it)
    scope: one provider, spend-capped
    max_ttl: 365d
  - name: BATCH_SIGNING_KEY
    consumer: env CI batch commit steps only (SSH commit signing; never the extract/AI step); public half in the env's records allowed-signers
    scope: signs batch commits to the records repo; the integrity check accepts it for the batch paths only
    max_ttl: 365d
  - name: RECORDS_APP_PRIVATE_KEY
    consumer: env CI, mints a per-job token for the records repo (contents write or read, no workflows); App ID is env.yaml github.records_app.id
    scope: GitHub App installed on the records repo only
    max_ttl: 365d
  - name: PRODUCT_DEPLOY_KEY
    consumer: env CI, checks out this product while it is private (read-only deploy key; drop after a public flip)
    scope: one product repo, read
    max_ttl: 365d
  - name: HEALTHCHECK_URL
    consumer: batch heartbeat (optional)
    scope: one check
    max_ttl: none

ack_modes: [off, vitals-only, all]     # admin private chat only; a group never gets a reply (ADR 011)
context_modes: [off, shadow, on]       # shadow: stored + admin digest only; on: timeline overlay (ADR 010)

adapters:
  llm: [claude-cli, fake]
  stt: [whisper-cpp, sarvam, none]
