# Example env file (synthetic; local dev and e2e). A real environment keeps its own env.yaml in its env repo.
schema: 1
records_dir: ../fixtures/records-example   # tools/kb/* --env reads this (relative to this file)
cloudflare:
  worker_name: saturn-bot
  compatibility_date: "2026-10-01"
  d1:
    name: saturn
    id: ""                                  # empty: wrangler auto-provisions on the first deploy; pin it afterwards
  r2_bucket: saturn-media
worker_url: ""
go_live: false
ack_mode: all                               # off | vitals-only | all; admin private chat only, never a group (ADR 011)
records:
  repo: example/records-example
  branch: main
batch:
  cron: "37 15 * * *"
  claude_code_version: "2.1.310"
  inbox_retention_days: 14
  llm_adapter: claude-cli
  stt_adapter: sarvam
