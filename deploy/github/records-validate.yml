# Records validation, run FROM the env repo (the records repo has no workflows and no Actions secrets).
# TEMPLATE for an env repo (see batch.yml). Read-only: App token minted with contents READ. Advisory: the owner reads
# a red run before merging an agent PR (input `ref` = the PR head branch).
name: records-validate

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Records branch to validate (default: records.branch from env.yaml)"
        type: string
        default: ""

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # ---- secrets: records-validate (SOPS files; key = secrets.SOPS_AGE_KEY; Team upgrade: environment "production") ----
      SECRETS_KEYS: secrets/github.sops.env # PRODUCT_DEPLOY_KEY, RECORDS_APP_PRIVATE_KEY
      # ---- end secrets: records-validate ----
    steps:
      - name: Checkout env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sops (pinned, sha256-checked)
        run: scripts/ci install

      - name: Read env.yaml and product.lock
        id: lock
        run: scripts/ci vars

      - name: Decrypt job keys (masked step outputs)
        id: keys
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/ci output "$SECRETS_KEYS" PRODUCT_DEPLOY_KEY RECORDS_APP_PRIVATE_KEY

      - name: Checkout product at lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.lock.outputs.product_repo }}
          ref: ${{ steps.lock.outputs.product_ref }}
          ssh-key: ${{ steps.keys.outputs.PRODUCT_DEPLOY_KEY }}
          path: product
          persist-credentials: false

      - name: Verify product tag = product.lock commit
        run: scripts/ci verify-lock product

      - name: Mint records token (1 h, contents READ, the records repo only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.RECORDS_APP_ID }}
          private-key: ${{ steps.keys.outputs.RECORDS_APP_PRIVATE_KEY }}
          owner: ${{ env.RECORDS_OWNER }}
          repositories: ${{ env.RECORDS_NAME }}
          permission-contents: read

      - name: Checkout records
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RECORDS_REPO }}
          ref: ${{ inputs.ref || env.TARGET_BRANCH }}
          token: ${{ steps.app.outputs.token }}
          path: records
          persist-credentials: false

      - name: Validate (schema_version, KB build, stale pages)
        run: |
          scripts/ci records-schema records product
          python3 -I product/tools/kb/build --records records --check
          python3 -I product/tools/kb/test_gen.py --records records
