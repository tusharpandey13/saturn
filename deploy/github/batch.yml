# Daily batch (ADR 005): D1 inbox -> records repo -> extraction -> KB -> pages -> digest.
# TEMPLATE for an env repo (copy deploy/github/*.yml to .github/workflows/ and deploy/github/ci to scripts/ci).
# Thin: every value comes from env.yaml / product.lock; all logic is the product's deploy/batch.sh.
# Triggers: schedule + workflow_dispatch only (never push / pull_request / pull_request_target).
# Secrets: ONE standing GitHub secret, SOPS_AGE_KEY. Each step decrypts only the SOPS files it needs (scripts/ci run).
# Records are written with a per-job GitHub App token (records repo only, contents write, no workflows); the token
# action revokes it in its post step. The records checkout keeps NO credential (persist-credentials: false): only the
# deterministic commit steps get the token (RECORDS_TOKEN) and the batch SSH signing key (BATCH_SIGNING_KEY); they
# refuse changes outside the batch paths and sign every commit. The AI step (extract: `claude -p`, no tools) gets the
# model token only; `scripts/ci run` unsets SOPS_AGE_KEY before the command, and batch.sh extract fails if any write
# credential is visible (assert-isolated). Voice notes: whisper.cpp built at a pinned tag + pinned model, cached.
name: batch

on:
  schedule:
    - cron: "37 15 * * *" # keep equal to env.yaml batch.cron
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Re-extract messages whose extraction failed permanently before"
        type: boolean
        default: false
      send_digest:
        description: "Send the digest"
        type: boolean
        default: true
      force_digest:
        description: "Send the digest even if today's was already sent"
        type: boolean
        default: false

concurrency:
  group: records-write # batch and records-pages both write the records repo
  cancel-in-progress: false

permissions: {}

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read # this env repo only; records writes use the App token
      actions: write # dispatch records-validate after the batch
    env:
      # ---- secrets: batch (SOPS files per step; key = secrets.SOPS_AGE_KEY. On a GitHub Team upgrade, move
      #      SOPS_AGE_KEY to environment "production" and add `environment:` to this job) ----
      SECRETS_KEYS: secrets/github.sops.env # PRODUCT_DEPLOY_KEY, RECORDS_APP_PRIVATE_KEY
      SECRETS_PULL: secrets/cloudflare-d1.sops.env secrets/cloudflare-r2-read.sops.env secrets/telegram-bot.sops.env
      SECRETS_EXTRACT: secrets/claude-ci.sops.env # CLAUDE_CODE_OAUTH_TOKEN only
      SECRETS_COMMIT: secrets/batch-signing.sops.env # BATCH_SIGNING_KEY (SSH; public half in guard/records-allowed-signers)
      SECRETS_FINISH: secrets/cloudflare-d1.sops.env secrets/telegram-bot.sops.env
      # ---- end secrets: batch ----
    steps:
      - name: Checkout env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sops (pinned, sha256-checked)
        run: scripts/ci install

      - name: Read env.yaml and product.lock
        id: lock
        run: scripts/ci vars

      - name: Go-live gate (scheduled runs wait for go_live true)
        if: github.event_name == 'schedule' && env.GO_LIVE != 'true'
        run: |
          echo "::notice::go_live is false in env.yaml: scheduled batch skipped (dispatch runs manually)"
          echo "SKIP=1" >> "$GITHUB_ENV"

      - name: Decrypt job keys (masked step outputs)
        if: env.SKIP != '1'
        id: keys
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/ci output "$SECRETS_KEYS" PRODUCT_DEPLOY_KEY RECORDS_APP_PRIVATE_KEY

      - name: Checkout product at lock (read-only deploy key while the product is private)
        if: env.SKIP != '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.lock.outputs.product_repo }}
          ref: ${{ steps.lock.outputs.product_ref }}
          ssh-key: ${{ steps.keys.outputs.PRODUCT_DEPLOY_KEY }}
          path: product
          persist-credentials: false

      - name: Verify product tag = product.lock commit
        if: env.SKIP != '1'
        run: scripts/ci verify-lock product

      - name: Mint records token (1 h, contents write, the records repo only)
        if: env.SKIP != '1'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.RECORDS_APP_ID }}
          private-key: ${{ steps.keys.outputs.RECORDS_APP_PRIVATE_KEY }}
          owner: ${{ env.RECORDS_OWNER }}
          repositories: ${{ env.RECORDS_NAME }}
          permission-contents: write

      - name: Checkout records (no credential kept; the commit steps get the token)
        if: env.SKIP != '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RECORDS_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ steps.app.outputs.token }}
          path: records
          persist-credentials: false

      - name: Records schema_version supported by this product
        if: env.SKIP != '1'
        run: scripts/ci records-schema records product

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SKIP != '1'
        with:
          node-version: "24"

      - name: Install (no secrets)
        if: env.SKIP != '1'
        run: |
          (cd product/app && npm ci --ignore-scripts --no-audit --no-fund)
          if [ -n "$CLAUDE_CODE_VERSION" ]; then npm install -g --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"; fi

      - name: Speech-to-text cache (whisper.cpp build + model, keyed on the pinned setup script)
        if: env.SKIP != '1' && env.STT_ADAPTER == 'whisper-cpp'
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('product/deploy/scripts/whisper-setup.sh') }}

      - name: Speech-to-text setup (no secrets; on failure voice notes wait as stt_pending)
        if: env.SKIP != '1' && env.STT_ADAPTER == 'whisper-cpp'
        continue-on-error: true
        run: |
          product/deploy/scripts/whisper-setup.sh "$RUNNER_TEMP/whisper"
          { echo "WHISPER_BIN=$RUNNER_TEMP/whisper/bin/whisper-cli"; echo "WHISPER_MODEL=$RUNNER_TEMP/whisper/models/ggml-large-v3-turbo-q5_0.bin"; } >> "$GITHUB_ENV"

      - name: Pull (raw first)
        if: env.SKIP != '1'
        id: pull
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # shellcheck disable=SC2086 # file lists split on spaces by design
          scripts/ci run $SECRETS_PULL -- product/deploy/batch.sh pull --records records

      - name: Commit raw (deterministic; batch paths only; signed)
        if: env.SKIP != '1'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RECORDS_TOKEN: ${{ steps.app.outputs.token }}
          REQUIRE_SIGNED: "1"
        run: |
          # shellcheck disable=SC2086
          scripts/ci run $SECRETS_COMMIT -- product/deploy/batch.sh commit raw --records records

      - name: Extract + KB + pages (AI step; model token only, no write credential)
        if: env.SKIP != '1'
        id: extract
        continue-on-error: true
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DISABLE_AUTOUPDATER: "1"
          RETRY: ${{ inputs.retry_failed && '--retry-failed' || '' }}
        run: |
          # shellcheck disable=SC2086
          scripts/ci run $SECRETS_EXTRACT -- product/deploy/batch.sh extract --records records ${RETRY:+"$RETRY"}

      - name: Commit batch (deterministic; batch paths only; signed)
        if: always() && env.SKIP != '1' && steps.pull.outcome == 'success'
        id: commit-batch
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RECORDS_TOKEN: ${{ steps.app.outputs.token }}
          REQUIRE_SIGNED: "1"
        run: |
          # shellcheck disable=SC2086
          scripts/ci run $SECRETS_COMMIT -- product/deploy/batch.sh commit batch --records records

      - name: Finish
        if: always() && env.SKIP != '1' && steps.lock.outcome == 'success'
        id: finish
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          NO_DIGEST: ${{ (github.event_name == 'workflow_dispatch' && !inputs.send_digest) && '--no-digest' || '' }}
          FORCE_DIGEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_digest) && '--force-digest' || '' }}
        run: |
          # shellcheck disable=SC2086
          scripts/ci run $SECRETS_FINISH -- product/deploy/batch.sh finish --records records ${NO_DIGEST:+"$NO_DIGEST"} ${FORCE_DIGEST:+"$FORCE_DIGEST"}

      - name: Commit digest log (deterministic; signed)
        if: always() && env.SKIP != '1' && steps.lock.outcome == 'success' && steps.app.outcome == 'success'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RECORDS_TOKEN: ${{ steps.app.outputs.token }}
          REQUIRE_SIGNED: "1"
        run: |
          # shellcheck disable=SC2086
          scripts/ci run $SECRETS_COMMIT -- product/deploy/batch.sh commit digest --records records

      - name: Validate records after the batch
        if: always() && env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run records-validate.yml --ref "$GITHUB_REF_NAME"

      - name: Fail loudly
        if: steps.extract.outcome == 'failure' || steps.commit-batch.outcome == 'failure'
        run: |
          echo "extract or its commit failed (or extraction was delayed); raw data is committed. See the step logs." >&2
          exit 1
