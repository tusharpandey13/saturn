# TEMPLATE for the env repo (copy to <env-repo>/.github/workflows/batch.yml; S7). Thin: checkout, tokens, call the
# product's deploy/batch.sh. Product logic never lives here. Triggers: schedule + workflow_dispatch only (plan 6a).
# The env repo holds: env.yaml, product.lock (product commit SHA), secrets (env.manifest.yaml names).
# Secrets stay in the step that uses them (never at job level, never in `npm ci`). Records are written with a
# per-job GitHub App token (records repo only, contents write, no workflows), revoked at the end.
name: batch
on:
  schedule:
    - cron: "37 15 * * *" # keep equal to env.yaml batch.cron
  workflow_dispatch:
    inputs:
      retry_failed: { description: "Re-extract messages that failed permanently before", type: boolean, default: false }
      send_digest: { description: "Send the digest", type: boolean, default: true }
concurrency: { group: batch, cancel-in-progress: false }
permissions: {}
jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: env, persist-credentials: false }
      - name: Read pins
        id: pins
        run: |
          echo "product_sha=$(tr -d '[:space:]' < env/product.lock)" >> "$GITHUB_OUTPUT"
          echo "records_repo=$(sed -n 's/^  repo: *//p' env/env.yaml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Checkout product (read-only deploy key while the product is private)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PRODUCT_REPO }}
          ref: ${{ steps.pins.outputs.product_sha }}
          ssh-key: ${{ secrets.PRODUCT_DEPLOY_KEY }}
          path: product
          persist-credentials: false
      - name: Records token (one repo, contents write)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RECORDS_WRITER_APP_ID }}
          private-key: ${{ secrets.RECORDS_WRITER_APP_KEY }}
          owner: ${{ vars.RECORDS_OWNER }}
          repositories: ${{ vars.RECORDS_REPO_NAME }}
          permission-contents: write
      - name: Checkout records (keeps the job-scoped App token for the push; no artifacts are uploaded)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.records_repo }}
          token: ${{ steps.app.outputs.token }}
          path: records
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: product/app/package-lock.json }
      - name: Install (no secrets)
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          (cd product/app && npm ci --ignore-scripts --no-audit --no-fund)
          # exact version pin from env vars (not a lockfile); bump deliberately
          if [ -n "$CLAUDE_CODE_VERSION" ]; then npm install -g --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"; fi
      - name: Pull (raw first)
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: product/deploy/batch.sh pull --records records
      - name: Extract + KB + pages
        id: extract
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_TOKEN_CREATED: ${{ vars.CLAUDE_TOKEN_CREATED }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
          RETRY: ${{ inputs.retry_failed && '--retry-failed' || '' }}
        run: product/deploy/batch.sh extract --records records ${RETRY:+"$RETRY"}
      - name: Finish
        if: always()
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GO_LIVE: ${{ vars.GO_LIVE }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          NO_DIGEST: ${{ (github.event_name == 'workflow_dispatch' && !inputs.send_digest) && '--no-digest' || '' }}
        run: product/deploy/batch.sh finish --records records ${NO_DIGEST:+"$NO_DIGEST"}
      - name: Fail loudly
        if: steps.extract.outcome == 'failure'
        run: |
          echo "extract failed or was delayed; raw data is committed. See the step logs." >&2
          exit 1
      - name: Revoke the records token
        if: always() && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE /installation/token || true
