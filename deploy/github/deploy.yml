# Deploy the Worker: render wrangler config from env.yaml, apply product migrations, deploy, push Worker secrets.
# TEMPLATE for an env repo (see batch.yml). Manual only, typed confirm (Free has no environment reviewers on private
# repos). Deploy does NOT set the Telegram webhook: that is the go-live step, run by the owner after "go".
name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to deploy'
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: inputs.confirm == 'deploy-prod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # ---- secrets: deploy (SOPS files; key = secrets.SOPS_AGE_KEY; Team upgrade: environment "production") ----
      SECRETS_KEYS: secrets/github.sops.env # PRODUCT_DEPLOY_KEY
      SECRETS_DEPLOY: secrets/cloudflare-deploy.sops.env secrets/telegram-bot.sops.env secrets/telegram-webhook.sops.env
      # ---- end secrets: deploy ----
    steps:
      - name: Checkout env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sops (pinned, sha256-checked)
        run: scripts/ci install

      - name: Read env.yaml and product.lock
        id: lock
        run: scripts/ci vars

      - name: Decrypt job keys (masked step outputs)
        id: keys
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/ci output "$SECRETS_KEYS" PRODUCT_DEPLOY_KEY

      - name: Checkout product at lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.lock.outputs.product_repo }}
          ref: ${{ steps.lock.outputs.product_ref }}
          ssh-key: ${{ steps.keys.outputs.PRODUCT_DEPLOY_KEY }}
          path: product
          persist-credentials: false

      - name: Verify product tag = product.lock commit
        run: scripts/ci verify-lock product

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install (no secrets)
        run: cd product/app && npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy (product script)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # shellcheck disable=SC2086
          scripts/ci run $SECRETS_DEPLOY -- product/deploy/deploy.sh --env env.yaml
